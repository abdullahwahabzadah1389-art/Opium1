<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 170" role="img" aria-label="Kri proxy">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#232323"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c5f6ff"/>
      <stop offset="100%" stop-color="#25b6e8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="300" height="170" rx="14" fill="url(#bg)"/>

  <!-- electric sparks -->
  <g stroke="#25b6e8" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round" filter="url(#glow)">
    <path d="M64 44 l16 6 l-12 8"/>
    <path d="M236 44 l-16 6 l12 8"/>
    <path d="M52 110 l16 2 l-10 8"/>
    <path d="M248 110 l-16 2 l10 8"/>
  </g>

  <!-- lightning bolt -->
  <path d="M162 24 L124 92 h26 l-14 54 l48 -76 h-28 z" fill="url(#bolt)" filter="url(#glow)"/>

  <text x="150" y="156" text-anchor="middle" font-family="'Source Sans Pro', Arial, sans-serif" font-weight="bold" font-size="26" fill="#ffffff" letter-spacing="6">KRI</text>
</svg>
