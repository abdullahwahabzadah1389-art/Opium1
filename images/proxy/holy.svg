<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 170" role="img" aria-label="Holy proxy">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#232323"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <linearGradient id="halo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd76a"/>
      <stop offset="50%" stop-color="#fff3c4"/>
      <stop offset="100%" stop-color="#ffcf4d"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="300" height="170" rx="14" fill="url(#bg)"/>

  <!-- rays -->
  <g stroke="#ffd76a" stroke-opacity="0.12" stroke-width="2">
    <line x1="150" y1="18" x2="150" y2="152"/>
    <line x1="86" y1="30" x2="214" y2="140"/>
    <line x1="214" y1="30" x2="86" y2="140"/>
    <line x1="52" y1="70" x2="248" y2="100"/>
    <line x1="248" y1="70" x2="52" y2="100"/>
  </g>

  <!-- halo -->
  <ellipse cx="150" cy="52" rx="58" ry="16" fill="none" stroke="url(#halo)" stroke-width="10" filter="url(#glow)"/>
  <ellipse cx="150" cy="52" rx="58" ry="16" fill="none" stroke="#fffbe8" stroke-width="3"/>

  <!-- wings hint -->
  <path d="M74 108 q18 -16 38 -6 q-16 4 -22 16 q-12 -4 -16 -10 z" fill="#ffffff" fill-opacity="0.55"/>
  <path d="M226 108 q-18 -16 -38 -6 q16 4 22 16 q12 -4 16 -10 z" fill="#ffffff" fill-opacity="0.55"/>

  <text x="150" y="118" text-anchor="middle" font-family="'Source Sans Pro', Arial, sans-serif" font-weight="bold" font-size="34" fill="#ffffff" letter-spacing="4">HOLY</text>
  <text x="150" y="144" text-anchor="middle" font-family="'Source Sans Pro', Arial, sans-serif" font-size="13" fill="#ffd76a" letter-spacing="3">HOLY UNBLOCKER</text>
</svg>
