<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 170" role="img" aria-label="Bathhouse proxy">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#232323"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fd8ff"/>
      <stop offset="100%" stop-color="#2b7fd4"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="300" height="170" rx="14" fill="url(#bg)"/>

  <!-- steam -->
  <g fill="none" stroke="#cfefff" stroke-opacity="0.55" stroke-width="4" stroke-linecap="round" filter="url(#glow)">
    <path d="M126 74 q-8 -12 0 -24 q8 -12 0 -22"/>
    <path d="M150 78 q-8 -14 0 -26 q8 -14 0 -26"/>
    <path d="M174 74 q-8 -12 0 -24 q8 -12 0 -22"/>
  </g>

  <!-- water -->
  <path d="M60 96 h180 v22 a14 14 0 0 1 -14 14 h-152 a14 14 0 0 1 -14 -14 z" fill="url(#water)" fill-opacity="0.9"/>
  <path d="M60 96 q22 -8 45 0 t45 0 t45 0 t45 0" fill="none" stroke="#bdefff" stroke-width="4" stroke-linecap="round"/>

  <text x="150" y="156" text-anchor="middle" font-family="'Source Sans Pro', Arial, sans-serif" font-weight="bold" font-size="24" fill="#ffffff" letter-spacing="3">BATHHOUSE</text>
</svg>
