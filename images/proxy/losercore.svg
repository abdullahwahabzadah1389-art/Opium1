<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 170" role="img" aria-label="LoserCore proxy">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#232323"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9d6b"/>
      <stop offset="55%" stop-color="#ff5e3a"/>
      <stop offset="100%" stop-color="#b32b12"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="300" height="170" rx="14" fill="url(#bg)"/>

  <circle cx="150" cy="60" r="30" fill="url(#core)" filter="url(#glow)"/>
  <circle cx="150" cy="60" r="42" fill="none" stroke="#ff5e3a" stroke-opacity="0.4" stroke-width="2"/>
  <circle cx="150" cy="60" r="52" fill="none" stroke="#ff5e3a" stroke-opacity="0.18" stroke-width="2"/>

  <text x="150" y="128" text-anchor="middle" font-family="'Source Sans Pro', Arial, sans-serif" font-weight="bold" font-size="28" fill="#ffffff" letter-spacing="3">LOSERCORE</text>
  <text x="150" y="150" text-anchor="middle" font-family="'Source Sans Pro', Arial, sans-serif" font-size="12" fill="#ff8a5c" letter-spacing="3">PROXY</text>
</svg>
