<html>
  	<head>
		<script type="text/javascript">
		/**
		 * Game config
		 */

		window.config = {
			debug: false,
			maxRatio: 16 / 9,
			minRatio: 9 / 16,
			numScreenshots: 4,
			unityWebglBuildUrl: 'Build/Boxing-Physics-2.json',
			unityWebglLoaderUrl: 'Build/UnityLoader.js'
		};
		</script>

	    <meta charset="utf-8">
	    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

		<title>Boxing Physics 2</title>

	    <link rel="stylesheet" type="text/css" href="style.css" />
  	</head>
  	<body>
	  	<div id="loader">
			<div id="slideshow">
				<div id="slideshow-top">
					<img alt="Boxing Physics 2" title="Boxing Physics 2" src="thumbnail.jpg" id="thumbnail" />

					<div id="slideshow-top-container">
						<div id="game-title">
							<h1>Boxing Physics 2</h1>
						</div>
						<div id="progress-container">
							<div id="progress-bar">
								<div id="progress-fill" style="width:0%"></div>
							</div>
							<div id="progress-amount">0%</div>
						</div>
					</div>
				</div>
				<div id="slideshow-images"></div>
				<div id="slideshow-nav"></div>
			</div>
		</div>

	  	<div id="game-container">
			<div id="game"></div>
		</div>

		<script type="text/javascript">
			// Local boot shim (replaces missing scripts/poki-unity-loader.js): load the
			// Unity loader from window.config, then instantiate with progress UI.
			(function () {
				var cfg = window.config;
				function setProgress(p) {
					p = Math.max(0, Math.min(1, p));
					var pct = Math.round(p * 100);
					var fill = document.getElementById("progress-fill");
					var amount = document.getElementById("progress-amount");
					if (fill) fill.style.width = pct + "%";
					if (amount) amount.textContent = pct + "%";
					if (p >= 1) {
						var overlay = document.getElementById("loader");
						if (overlay) overlay.style.display = "none";
					}
				}
				setProgress(0);
				var s = document.createElement("script");
				s.src = cfg.unityWebglLoaderUrl;
				s.onload = function () {
					UnityLoader.instantiate(document.getElementById("game"), cfg.unityWebglBuildUrl, {
						onProgress: setProgress
					});
				};
				s.onerror = function () { setProgress(0); };
				document.body.appendChild(s);
			})();
		</script>
	</html>
